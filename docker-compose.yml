version: '3.9'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: compassproduct
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-private-network

  app:
    build: .
    restart: always
    ports:
      - '3000:3000'
    environment:
      DB_NAME: compassproduct
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3000
    depends_on:
      - db
    networks:
      - app-private-network

volumes:
  pgdata:

networks:
  app-private-network:
    driver: bridge
    name: app-private-network